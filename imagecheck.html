<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripFlow — Image Pipeline Diagnostic</title>
<style>
  :root{ color-scheme: light; }
  *{box-sizing:border-box}
  body{margin:0;padding:18px;background:#f4f6f5;color:#10251e;
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#5b6b65;font-size:13px;margin:0 0 18px}
  .test{background:#fff;border:1px solid #dfe5e2;border-radius:12px;padding:14px;margin-bottom:12px}
  .name{font-weight:700;font-size:14px;margin-bottom:8px}
  .status{font-weight:800;font-size:15px;margin-bottom:6px}
  .pass{color:#11795c}
  .fail{color:#c94c4c}
  .pending{color:#8a968f}
  .detail{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.45;
          background:#f4f6f5;border-radius:8px;padding:9px;margin-top:8px;
          word-break:break-all;white-space:pre-wrap;max-height:200px;overflow:auto}
  img.probe{max-width:100%;border-radius:8px;margin-top:8px;display:block;background:#e8ecea}
  .big{font-size:17px;font-weight:800;padding:12px;border-radius:10px;margin-bottom:16px;text-align:center}
  .big.pass{background:#dff3ec}
  .big.fail{background:#fbe7e7}
  .big.pending{background:#eef1f0}
  button{font:inherit;font-weight:700;background:#11795c;color:#fff;border:0;
         border-radius:10px;padding:11px 16px;width:100%;margin-bottom:16px}
</style>
</head>
<body>

<h1>TripFlow image pipeline diagnostic</h1>
<p class="sub">Loads the app's real networking code and drives it exactly as the app does. Screenshot the whole page and send it back.</p>

<div class="big pending" id="verdict">Running…</div>
<button id="rerun">Re-run</button>
<div id="out"></div>

<!-- The REAL data layer: fetchWikiThumbnail, the cache, the concurrency queue, the chain.
     Loaded with a rotating token so this page can never test a stale copy of it. -->
<script>
  window.ASSET_VERSION = String(Math.floor(Date.now()/3600000));
  document.write('<scr'+'ipt src="data.js?v=' + window.ASSET_VERSION + '"><\/scr'+'ipt>');
</script>

<script>
'use strict';
const out = document.getElementById('out');
const verdict = document.getElementById('verdict');

function card(name){
  const el = document.createElement('div');
  el.className = 'test';
  el.innerHTML = '<div class="name">'+name+'</div><div class="status pending">running…</div>';
  out.appendChild(el);
  return {
    set(ok, text, detail){
      const s = el.querySelector('.status');
      s.className = 'status ' + (ok ? 'pass' : 'fail');
      s.textContent = (ok ? '✅ ' : '❌ ') + text;
      if(detail){ const d = document.createElement('div'); d.className='detail'; d.textContent = detail; el.appendChild(d); }
    },
    addImage(url){ const im=document.createElement('img'); im.className='probe'; im.src=url; el.appendChild(im); }
  };
}
function probeImage(url, ms){
  return new Promise(resolve=>{
    const im = new Image(); let done = false;
    const finish = (ok, why)=>{ if(done) return; done = true; resolve({ok, why, w: im.naturalWidth}); };
    im.onload = ()=> finish(im.naturalWidth>0, im.naturalWidth>0 ? 'loaded' : 'zero width');
    im.onerror = ()=> finish(false, 'onerror (blocked, 404 or unreachable)');
    setTimeout(()=>finish(false, 'timed out after '+(ms/1000)+'s'), ms);
    im.src = url;
  });
}

async function run(){
  out.innerHTML = '';
  verdict.className = 'big pending';
  verdict.textContent = 'Running…';

  // 0. Is the real data layer even present?
  const load = card('App data layer loaded');
  const haveLayer = typeof fetchWikiThumbnail === 'function' && typeof fetchWikiThumbnailChain === 'function';
  load.set(haveLayer,
    haveLayer ? 'data.js loaded — testing the REAL pipeline' : 'data.js did NOT load — cannot test the real pipeline',
    'ASSET_VERSION: ' + window.ASSET_VERSION
      + '\nfetchWikiThumbnail: ' + typeof fetchWikiThumbnail
      + '\nfetchWikiThumbnailChain: ' + typeof fetchWikiThumbnailChain
      + '\nwithPhotoSlot (concurrency queue): ' + (typeof withPhotoSlot)
      + '\ncapWikiThumb: ' + (typeof capWikiThumb));
  if(!haveLayer){
    verdict.className = 'big fail';
    verdict.textContent = "The app's data layer failed to load — that alone would stop every photo.";
    return;
  }

  // 1. What is actually sitting in this browser's cache right now?
  const cc = card('Photo cache in this browser');
  try{
    const raw = localStorage.getItem('tripflow_photo_cache_v1');
    const obj = raw ? JSON.parse(raw) : {};
    const keys = Object.keys(obj);
    const real = keys.filter(k=>typeof obj[k]==='string' && obj[k]);
    const misses = keys.filter(k=>obj[k] && typeof obj[k]==='object' && obj[k].miss);
    const legacy = keys.filter(k=>!obj[k]);
    cc.set(true, keys.length + ' entries — ' + real.length + ' photos, ' + misses.length + ' misses, ' + legacy.length + ' legacy',
      real.length ? 'Example stored photo:\n' + obj[real[0]] : 'No successful photo lookups are stored.');
  }catch(err){ cc.set(false, 'Could not read the cache', String(err)); }

  // 2. Drive the REAL lookup for things the app actually asks for.
  const queries = [
    "Katz's Delicatessen New York City",
    'Eiffel Tower Paris',
    'Tokyo',
    'Senso-ji Temple Tokyo',
  ];
  let anyUrl = false, anyRender = false;
  for(const q of queries){
    const c = card('Real pipeline: fetchWikiThumbnail("' + q + '")');
    let url = null, err = null;
    const t0 = Date.now();
    try{ url = await fetchWikiThumbnail(q); }
    catch(e){ err = e; }
    const ms = Date.now() - t0;
    if(err){ c.set(false, 'threw after ' + ms + 'ms', String(err && err.message || err)); continue; }
    if(!url){ c.set(false, 'returned no URL after ' + ms + 'ms', 'The app would show a placeholder here.\nEither the lookup failed, or a remembered miss suppressed the retry.'); continue; }
    anyUrl = true;
    const r = await probeImage(url, 12000);
    if(r.ok) anyRender = true;
    c.set(r.ok, r.ok ? ('URL returned in ' + ms + 'ms and the image RENDERED (' + r.w + 'px)') : ('URL returned but the image FAILED to render — ' + r.why), url);
    if(r.ok) c.addImage(url);
  }

  // 3. The multi-tier chain, as the app uses it.
  const ch = card('Real pipeline: fetchWikiThumbnailChain (fallback tiers)');
  try{
    const chained = await fetchWikiThumbnailChain(['Definitely Not A Real Place XYZQ', 'Paris']);
    ch.set(!!chained, chained ? 'Fell through to the second tier and returned a URL' : 'Chain returned nothing for either tier', chained || '(null)');
    if(chained) ch.addImage(chained);
  }catch(e){ ch.set(false, 'chain threw', String(e && e.message || e)); }

  // 4. Does the concurrency queue drain, or is it deadlocking?
  const cq = card('Concurrency queue drains under load');
  try{
    const t0 = Date.now();
    const many = await Promise.all(Array.from({length:12}, (_,i)=>fetchWikiThumbnail('queue probe ' + i)));
    cq.set(true, '12 queued lookups all settled in ' + (Date.now()-t0) + 'ms',
      'Resolved: ' + many.length + ' (a hang here would mean the queue never releases its slots)');
  }catch(e){ cq.set(false, 'queue test threw', String(e && e.message || e)); }

  const env = card('This browser');
  env.set(true, 'Environment', 'userAgent: ' + navigator.userAgent + '\nonLine: ' + navigator.onLine + '\norigin: ' + location.origin);

  if(anyRender){
    verdict.className = 'big pass';
    verdict.textContent = 'The real pipeline works here — photos were fetched AND rendered.';
  } else if(anyUrl){
    verdict.className = 'big fail';
    verdict.textContent = 'Lookups return URLs, but the images will not render on this device.';
  } else {
    verdict.className = 'big fail';
    verdict.textContent = 'The pipeline returned no photo URLs at all on this device.';
  }
}

document.getElementById('rerun').onclick = run;
run();
</script>
</body>
</html>
